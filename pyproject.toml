[project]
name = "tutorials"
version = "0.1.0"
description = "Practical tutorials and runnable examples for Maida behavioral regression gates"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "maida-ai>=0.6.0",
]

[project.optional-dependencies]
langchain = [
    "maida-ai[langchain]>=0.6.0",
]
openai = [
    "maida-ai[openai]>=0.6.0",
]

[dependency-groups]
notebooks = ["jupyter", "ipykernel"]
