[project]
name = "langfuse-gate-demo"
version = "0.1.0"
description = "A deterministic demo of Maida gating traces imported from Langfuse"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "maida-ai>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "ruff>=0.15.1,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
