version: 2
trials: 3
fail_fast: true
metrics:
  stop_condition_reached: {kind: invariant, require: true}
  no_loops: {kind: invariant, require: true}
  no_guardrails: {kind: invariant, require: true}
  required_tools:
    kind: invariant
    all_of:
      - inspect_ticket_evidence
      - set_evidence_based_priority
      - route_developer_support
      - summarize_routing_context
  forbidden_tools:
    kind: invariant
    none_of: [assume_root_cause, close_uncertain_ticket]
  tool_call_count:
    kind: measured
    direction: upper
    aggregate: max
    limit: 4
