version: 2
trials: 3
fail_fast: true
metrics:
  stop_condition_reached: {kind: invariant, require: true}
  no_loops: {kind: invariant, require: true}
  no_guardrails: {kind: invariant, require: true}
  required_tools:
    kind: invariant
    all_of:
      - inspect_source_values
      - preserve_source_artifacts
      - separate_assumptions
      - mark_uncertainty
      - request_clarification
  forbidden_tools:
    kind: invariant
    none_of: [invent_missing_value, present_unverified_result]
  tool_call_count:
    kind: measured
    direction: upper
    aggregate: max
    limit: 5
