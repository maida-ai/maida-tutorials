[project]
name = "pr-gate-demo"
version = "0.1.0"
description = "A deterministic demo of Maida catching an AGENTS.md behavioral regression"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "maida-ai>=0.5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "ruff>=0.15.1,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.uv.sources]
maida-ai = { git = "https://github.com/maida-ai/maida", rev = "e69109354f881758d32c4d659fe368ba04049fa2" }
