name: Tutorial user workflows
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tutorials:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra langchain --extra openai
      - run: uv run --frozen --extra langchain --extra openai python -m unittest discover -s tests
      - name: Published onboarding from a fresh user project
        run: uv run --no-project --with "maida-ai==0.5.3" python -m unittest discover -s onboarding/tests
