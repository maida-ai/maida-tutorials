name: Langfuse Gate Demo

on:
  pull_request:
    paths:
      - "demos/langfuse-gate/**"
      - ".github/workflows/langfuse-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "demos/langfuse-gate/uv.lock"

      - name: Install locked environment
        run: uv sync --directory demos/langfuse-gate --locked

      - name: Run tests
        run: uv run --directory demos/langfuse-gate --frozen pytest -q

      - name: Rehearse the automatic demo
        run: uv run --directory demos/langfuse-gate --frozen python demo.py

      - name: Check formatting and lint
        run: |
          uv run --directory demos/langfuse-gate --frozen ruff check .
          uv run --directory demos/langfuse-gate --frozen ruff format --check .
