name: PR Gate Demo

on:
  pull_request:
    paths:
      - "demos/pr-gate/**"
      - ".github/workflows/pr-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Canonical project tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "demos/pr-gate/uv.lock"

      - name: Install locked environment
        run: uv sync --directory demos/pr-gate --locked --dev

      - name: Run project tests
        run: uv run --directory demos/pr-gate --frozen python -m pytest -q

      - name: Check formatting and lint
        run: |
          uv run --directory demos/pr-gate --frozen ruff check .
          uv run --directory demos/pr-gate --frozen ruff format --check .

  scenarios:
    name: Expected verdict / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [safe-refactor, test-laundering, weakened-verification, self-improvement]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "demos/pr-gate/uv.lock"
      - name: Install locked environment
        run: uv sync --directory demos/pr-gate --locked
      - name: Verify expected scenario verdict
        env:
          SCENARIO: ${{ matrix.scenario }}
          UV_OFFLINE: "1"
        run: uv run --directory demos/pr-gate --frozen python demo.py --scenario "$SCENARIO" --no-color

  maida:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    name: Intentional regression demonstration (expected FAIL)
    # The committed fixture contains the regression. Normal PR checks assert
    # both PASS and FAIL in isolated workspaces without publishing a false alarm.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "demos/pr-gate/uv.lock"

      # The Action launches the agent with setup-python, outside the uv project
      # environment. Install the same locked dependencies for the agent there.
      - name: Set up the Action Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies for the agent subprocess
        run: |
          uv export --directory demos/pr-gate --locked --all-groups --no-emit-project --output-file "$RUNNER_TEMP/pr-gate-requirements.txt" > /dev/null
          uv pip install --python "$(command -v python)" --requirements "$RUNNER_TEMP/pr-gate-requirements.txt"

      - name: Run Maida regression gate
        id: maida
        uses: maida-ai/maida-assert@8ba54c181ef26df9eaecd38bb46a107756297b28 # v0.6.0
        with:
          agent-script: demos/pr-gate/coding_agent.py
          baseline: demos/pr-gate/.maida/baselines/coding-agent.json
          policy: demos/pr-gate/.maida/policy.yaml
          maida-version: v0.6.1
          python-version: "3.13"
          mode: report-only
          post-comment: "false"

      - name: Fail on the expected Maida verdict
        env:
          VERDICT: ${{ steps.maida.outputs.verdict }}
        run: |
          if [ "$VERDICT" != "fail" ]; then
            echo "::error::Expected Maida FAIL for the committed regression; got '${VERDICT:-missing}'."
            exit 2
          fi
          echo "::error::Maida reported the expected behavioral regression (FAIL)."
          exit 1
